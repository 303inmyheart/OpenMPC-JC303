# Acid 303 edition: native MPC controls, generated hardware artwork.
style=dark
font_label=art/DejaVuSans.ttf
font_title=art/DejaVuSans.ttf
theme_bg=AEB4AC
theme_accent=C6F35B
theme_accent_hi=D6FF78
theme_ink=202821
theme_ink_dim=C6F35B
theme_knob_face=292D29
theme_knob_ring=56624D
theme_knob_dot=C6F35B
theme_seg_active=C6F35B
theme_seg_active_tx=182015
theme_seg_inactive=202820
theme_lcd=141D16
theme_line=586250
theme_btn_bg=202820
theme_btn_on=C6F35B
theme_btn_text=EFF3DC
theme_tile_on=34452A
qlink_bounds=column

[tab SYNTH]
frame x=24 y=104 w=1230 h=590 title="JC303 / SYNTH"
knob cx=184 cy=280 r=41 bw=220 ns=18 vs=23 label="WAVE MORPH" key=waveform
knob cx=488 cy=280 r=41 bw=220 ns=18 vs=23 label="TUNING" key=tuning
knob cx=792 cy=280 r=41 bw=220 ns=18 vs=23 label="CUTOFF" key=cutoff
knob cx=1096 cy=280 r=41 bw=220 ns=18 vs=23 label="RESONANCE" key=resonance
knob cx=184 cy=490 r=41 bw=220 ns=18 vs=23 label="ENV MOD" key=envmod
knob cx=488 cy=490 r=41 bw=220 ns=18 vs=23 label="DECAY" key=decay
knob cx=792 cy=490 r=41 bw=220 ns=18 vs=23 label="ACCENT" key=accent
knob cx=1096 cy=490 r=41 bw=220 ns=18 vs=23 label="VOLUME" key=volume
qlinks "SYNTH" = waveform,envmod,-,-,tuning,decay,-,-,cutoff,accent,-,-,resonance,volume,-,-

[tab MODS]
frame x=24 y=104 w=1230 h=590 title="JC303 / MODS"
toggle cx=184 cy=270 bw=200 label="MODS" key=switchModState
knob cx=488 cy=270 r=41 bw=220 ns=18 vs=23 label="AMP DECAY" key=normalDecay
knob cx=792 cy=270 r=41 bw=220 ns=18 vs=23 label="ACCENT DECAY" key=accentDecay
knob cx=1096 cy=270 r=41 bw=220 ns=18 vs=23 label="FEEDBACK HP" key=feedbackFilter
knob cx=184 cy=430 r=41 bw=220 ns=18 vs=23 label="SOFT ATTACK" key=softAttack
knob cx=488 cy=430 r=41 bw=220 ns=18 vs=23 label="SLIDE TIME" key=slideTime
knob cx=792 cy=430 r=41 bw=220 ns=18 vs=23 label="SQUARE DRIVE" key=sqrDriver
enum_h cx=1096 cy=430 sw=105 sh=36 rows=2 label="LEGACY FILTER" key=filterType options="TeeBee,Diode Oct.,Diode"
knob cx=184 cy=590 r=41 bw=220 ns=18 vs=23 label="LEGACY DRIVE" key=filterDrive
knob cx=488 cy=590 r=41 bw=220 ns=18 vs=23 label="BASS COMP" key=bassComp
qlinks "MODS" = switchModState,softAttack,filterDrive,-,normalDecay,slideTime,bassComp,-,accentDecay,sqrDriver,-,-,feedbackFilter,filterType,-,-

[tab LFO]
frame x=24 y=104 w=1230 h=590 title="JC303 / LFO"
toggle cx=184 cy=280 bw=200 label="MODS" key=switchModState
enum_h cx=488 cy=280 sw=105 sh=36 rows=3 label="LFO WAVE" key=lfoWaveform
knob cx=792 cy=280 r=41 bw=220 ns=18 vs=23 label="LFO RATE" key=lfoRate
knob cx=1096 cy=280 r=41 bw=220 ns=18 vs=23 label="LFO DEPTH" key=lfoDepth
enum_h cx=184 cy=480 sw=105 sh=36 rows=2 label="DESTINATION" key=lfoDestination
qlinks "LFO" = switchModState,lfoDestination,-,-,lfoWaveform,-,-,-,lfoRate,-,-,-,lfoDepth,-,-,-

[tab SEQUENCE]
frame x=24 y=104 w=1230 h=590 title="JC303 / SEQUENCE"
readout cx=184 cy=215 w=220 h=36 key=seqStatus label=""
readout cx=488 cy=215 w=220 h=36 key=seqCurrent label=""
toggle cx=1032 cy=625 bw=120 key=seqEnabled label="SEQUENCER"
list x=64 y=266 w=1152 cols=8 rows=2 th=52 gap=8 key=seqStep mark=0 tsize=22
knob cx=184 cy=452 r=41 bw=220 ns=18 vs=23 key=seqSelected label="EDIT STEP"
knob cx=488 cy=452 r=41 bw=220 ns=18 vs=23 key=seqNote label="NOTE"
knob cx=792 cy=452 r=41 bw=220 ns=18 vs=23 key=seqLength label="LENGTH"
knob cx=1096 cy=452 r=41 bw=220 ns=18 vs=23 key=seqTranspose label="TRANSPOSE"
toggle cx=184 cy=625 bw=180 key=seqRest label="REST"
toggle cx=488 cy=625 bw=180 key=seqAccent label="ACCENT"
toggle cx=792 cy=625 bw=180 key=seqSlide label="SLIDE"
toggle cx=1158 cy=625 bw=110 key=seqTie label="TIE"
qlinks "SEQUENCE" = seqSelected,seqRest,-,-,seqNote,seqAccent,-,-,seqLength,seqSlide,-,-,seqTranspose,seqTie,seqEnabled,-

[tab GENERATE]
frame x=24 y=104 w=1230 h=590 title="JC303 / GENERATE + RECORD"
toggle cx=184 cy=250 bw=180 key=seqEnabled label="SEQUENCER"
toggle cx=488 cy=250 bw=180 key=seqRecord label="RECORD"
