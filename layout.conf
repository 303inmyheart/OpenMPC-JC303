knob cx=1096 cy=430 r=41 bw=220 ns=18 vs=23 key=seqGenTie label="TIE PROB"
knob cx=184 cy=590 r=41 bw=220 ns=18 vs=23 key=seqTones label="TONES"
knob cx=488 cy=590 r=41 bw=220 ns=18 vs=23 key=seqLow label="LOW NOTE"
knob cx=792 cy=590 r=41 bw=220 ns=18 vs=23 key=seqRange label="NOTE RANGE"
qlinks "GENERATE" = seqEnabled,seqFill,seqTones,-,seqRecord,seqGenAccent,seqLow,-,seqGenSlide,seqRange,-,-,seqGenTie,-,-,-


[tab DRIVE]
frame x=24 y=104 w=1230 h=590 title="JC303 / GUITARML DRIVE"
toggle cx=184 cy=280 bw=200 label="DRIVE" key=driveEnabled
popup cx=774 cy=280 w=820 h=58 cw=382 cols=3 label="MODEL" key=driveModel
knob cx=184 cy=470 r=41 bw=220 ns=18 vs=23 label="LEVEL / GAIN" key=driveLevel
knob cx=488 cy=470 r=41 bw=220 ns=18 vs=23 label="DRY / WET" key=driveMix
